name: Deploy frontend develop

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy frontend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_FRONTEND_DIR: ${{ secrets.EC2_FRONTEND_DIR }}
          PM2_FRONTEND_NAME: ${{ secrets.PM2_FRONTEND_NAME }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_deploy_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "EC2_FRONTEND_DIR='$EC2_FRONTEND_DIR' PM2_FRONTEND_NAME='$PM2_FRONTEND_NAME' bash -s" <<'EOF'
          set -euo pipefail

          APP_DIR="${EC2_FRONTEND_DIR:-$HOME/personal-blog-site-frontend}"
          PM2_NAME="${PM2_FRONTEND_NAME:-personal-blog-site-frontend}"

          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
          fi

          cd "$APP_DIR"

          git fetch origin develop
          git checkout develop
          git pull --ff-only origin develop

          corepack enable
          corepack prepare pnpm@10.29.3 --activate

          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build

          pm2 restart "$PM2_NAME" --update-env
          pm2 save
          EOF
